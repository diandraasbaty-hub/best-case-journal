<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2689F">
<title>The Best Case Journal</title>
<link rel="icon" href="assets/stamp-burgundy.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&display=swap">
<style>
/* The Club's world: pink sunburst, a retro sun, scalloped edges, ink outlines with block shadows,
   mint / lilac / butter stickers. The writing page itself stays calm: cream paper, ruled lines. */
@font-face { font-family: "Fraunces Local"; font-weight: 400; src: url(assets/Fraunces-400.ttf); }
@font-face { font-family: "Fraunces Local"; font-weight: 600 900; src: url(assets/Fraunces-600.ttf); }
@font-face { font-family: "Diandra Hand"; src: url(assets/DiandraHand-Marker.otf); font-display: swap; }
:root {
  --cream: #F3ECE1; --paper: #FFF9F0; --plum: #4A2140; --burgundy: #6B1E2E; --pink: #F2689F; --pink-2: #F47BAB;
  --pink-ink: #C2255F; --sun: #F7A531; --orange: #F08A3C; --mint: #93DEC8; --lilac: #C9B2F2; --butter: #FFD45E; --ink: #2A0F1C; --rule: #E6D8C4;
  --serif: Fraunces, "Fraunces Local", Georgia, serif;
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Diandra Hand", "Bradley Hand", cursive;
  --out: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--cream); }
body { margin: 0; background: var(--cream); color: var(--ink); font: 500 17px/1.5 var(--sans); padding-bottom: calc(96px + env(safe-area-inset-bottom)); caret-color: var(--pink); }
::selection { background: var(--butter); color: var(--ink); }
[hidden] { display: none !important; }
#app { max-width: 560px; margin: 0 auto; }
#f h2 { font-size: 23px; }
.pad { padding: 22px 18px 0; display: flex; flex-direction: column; gap: 26px; }
p { margin: 0; }
a { color: var(--burgundy); text-underline-offset: 3px; }
h2 { font: 600 26px/1.18 var(--serif); font-variation-settings: "SOFT" 100; color: var(--burgundy); margin: 0; text-wrap: balance; }
.display { font: italic 900 32px/1.04 var(--serif); font-variation-settings: "SOFT" 100, "WONK" 1; color: var(--paper); margin: 0;
  -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 3px 4px 0 var(--ink); text-wrap: balance; letter-spacing: .015em; }
.display em { font-style: inherit; color: var(--butter); }
.hand, h2.hand { font-family: var(--hand); font-weight: 400; font-variation-settings: normal; color: var(--pink-ink); font-size: 26px; line-height: 1.1; display: inline-block; transform: rotate(-2deg); margin: 0; }
.small { font-size: 16px; }

/* ---- the band: sunburst header ---- */
.band { position: relative; overflow: hidden; padding: calc(14px + env(safe-area-inset-top)) 18px 40px; color: var(--ink);
  background: repeating-conic-gradient(from 4deg at 82% 108%, var(--pink) 0 9deg, var(--pink-2) 9deg 18deg); }
.band::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 15px; z-index: 3;
  background: radial-gradient(circle at 15px 17px, var(--cream) 14px, transparent 14.6px) 0 0 / 30px 15px repeat-x; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 16px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; position: relative; z-index: 2; }
.sticker { border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); display: grid; place-items: center; flex: none; }
.sticker img { width: 96%; display: block; }
.brand .sticker { width: 78px; height: 78px; transform: rotate(-8deg); }
.band .display { position: relative; z-index: 2; margin-top: 20px; max-width: calc(100% - 132px); }
.band:not(.hero) { min-height: 196px; }
.band .when { position: relative; z-index: 2; margin-top: 10px; font-weight: 700; font-size: 16px; max-width: calc(100% - 160px); text-wrap: balance; }
.sun { position: absolute; right: 14px; bottom: -46px; width: 136px; height: 136px; border-radius: 50%; z-index: 1; text-align: center;
  border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  background: linear-gradient(var(--sun) 0 54%, var(--pink) 54% 59%, var(--sun) 59% 100%); }
.sun b { display: block; font: italic 900 40px/1 var(--serif); font-variation-settings: "SOFT" 100, "WONK" 1; margin-top: 10px; }
.sun span { display: block; font: 800 16px/1 var(--sans); margin-top: 2px; letter-spacing: -.01em; }
.sun svg { width: 58px; margin-top: 20px; }
.hero .rays { right: auto; bottom: auto; left: 50%; top: calc(12px + 14px + env(safe-area-inset-top) + 95px); width: 290px; height: 290px; transform: translate(-50%, -50%); animation: none; }
.rays { position: absolute; right: -27px; bottom: -87px; width: 218px; height: 218px; z-index: 0; }
.deco { position: absolute; z-index: 1; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) {
  .sun, .rays { animation: rise .9s var(--out) both; }
  @keyframes rise { from { transform: translateY(70px); } }
  .btn, .tabs button, .row, .day { transition: transform .12s var(--out), box-shadow .12s var(--out); }
}
.note { align-self: flex-start; background: var(--butter); border: 2px dashed var(--ink); border-radius: 12px; padding: 6px 12px; font-size: 16px; font-weight: 600; }

/* ---- cards ---- */
.card { background: var(--paper); border: 3px solid var(--ink); border-radius: 26px 34px 28px 36px; box-shadow: 6px 6px 0 var(--ink); padding: 20px 18px 14px; overflow: hidden; }
.card > .cap { margin: -20px -18px 14px; padding: 14px 18px 10px; border-bottom: 3px solid var(--ink); }
.cap.lilac { background: var(--lilac); } .cap.mint { background: var(--mint); } .cap.butter { background: var(--butter); }
.cap .hand { color: var(--ink); }
.card.mint { background: var(--mint); } .card.butter { background: var(--butter); } .card.lilac { background: var(--lilac); }
.card h2 + p, .card .hand + h2 { margin-top: 8px; }
.card .hand { margin-bottom: 2px; }

textarea { display: block; width: 100%; min-height: 192px; margin-top: 14px; padding: 0 2px; border: 0; outline: 0; resize: none; border-radius: 4px;
  font: 400 19px/32px var(--serif); font-variation-settings: "SOFT" 50; color: var(--ink);
  background: repeating-linear-gradient(transparent 0 31px, var(--rule) 31px 32px); field-sizing: content; }
textarea:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
h1:focus { outline: 0; }
textarea::placeholder { color: #7A6457; }
textarea:disabled { opacity: .7; }
.status { min-height: 24px; text-align: right; font-size: 16px; font-weight: 600; color: var(--plum); margin-top: 8px; }
.status.ok::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--sun); border: 2px solid var(--ink); margin-right: 7px; }
.status.bad { color: #A3201A; }

/* ---- form ---- */
label { display: block; font-weight: 700; margin: 0 0 6px; }
input[type=email] { width: 100%; font: 500 18px var(--sans); padding: 14px; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 14px 18px 14px 18px; }
input[type=email]:focus-visible, .btn:focus-visible, .tabs button:focus-visible, .row:focus-visible, .day:focus-visible, .link:focus-visible, .check input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 500; padding: 10px 0; margin: 0; }
.check input { appearance: none; -webkit-appearance: none; width: 28px; height: 28px; margin: 0; flex: none; background: #fff; border: 3px solid var(--ink); border-radius: 8px; display: grid; place-content: center; cursor: pointer; }
.check input:checked { background: var(--butter); }
.check input:checked::after { content: ""; width: 13px; height: 7px; border: solid var(--ink); border-width: 0 0 3px 3px; transform: translateY(-2px) rotate(-45deg); }
.btn { display: block; width: 100%; padding: 15px 18px; cursor: pointer; text-align: center; text-decoration: none;
  font: 800 16px/1.2 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--ink);
  background: var(--pink); border: 3px solid var(--ink); border-radius: 99px; box-shadow: 5px 5px 0 var(--ink); }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
.btn[disabled] { opacity: .55; }
.link { background: none; border: 0; padding: 10px 0; font: inherit; font-weight: 700; font-size: 16px; color: var(--burgundy); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; align-self: flex-start; }
.err { color: #A3201A; font-weight: 700; }
.err:empty { display: none; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.promise { background: var(--lilac); border: 3px solid var(--ink); border-radius: 8px 22px 10px 24px; box-shadow: 5px 5px 0 var(--ink); padding: 16px 18px 12px; transform: rotate(-1.2deg); margin: 0 6px; }
.promise p { font: 600 19px/1.35 var(--serif); font-variation-settings: "SOFT" 100; }
.promise .hand { color: var(--ink); font-size: 27px; margin-top: 6px; }

/* ---- sign-in hero ---- */
.band.hero { padding-bottom: 44px; text-align: center; background: repeating-conic-gradient(from 0deg at 50% 44%, var(--pink) 0 9deg, var(--pink-2) 9deg 18deg); }
.hero .bigsun { width: 236px; height: 236px; margin: 12px auto 0; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); position: relative; z-index: 1;
  background: linear-gradient(var(--sun) 0 62%, var(--pink) 62% 67%, var(--sun) 67% 75%, var(--pink) 75% 84%, var(--sun) 84% 100%); display: grid; place-items: center; }
.hero .bigsun .sticker { width: 212px; height: 212px; transform: translate(8px, 5px) rotate(-8deg); box-shadow: 5px 5px 0 var(--ink); border-width: 3px; }
.hero .display { font-size: 38px; max-width: none; margin-top: 18px; min-height: 0; }

/* ---- entries ---- */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px 2px; margin: 14px -6px 0; }
.day::after { content: ""; position: absolute; inset: -1px; }
.day { position: relative; aspect-ratio: 1; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); color: var(--ink); font: 700 16px/1 var(--sans); cursor: pointer; padding: 0; }
.day.on { background: var(--sun); box-shadow: 2px 2px 0 var(--ink); }
.day.now { background: var(--pink); }
.day.later { border-style: dashed; border-color: #BFAE9C; color: #6E5A50; cursor: default; }
.key { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; font-size: 16px; font-weight: 600; }
.key i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); margin-right: 6px; vertical-align: -1px; }
.row { display: flex; gap: 14px; align-items: stretch; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; padding: 0; overflow: hidden;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 22px 28px 22px 30px; box-shadow: 5px 5px 0 var(--ink); }
.row:active, .day:active { transform: translate(2px, 2px); }
.row .tab { flex: none; width: 74px; display: grid; place-content: center; text-align: center; border-right: 3px solid var(--ink); font: 800 16px/1 var(--sans); text-transform: uppercase; letter-spacing: .06em; padding: 10px 0; }
.row .tab b { display: block; font: italic 900 34px/1 var(--serif); font-variation-settings: "SOFT" 100, "WONK" 1; letter-spacing: 0; margin-top: 3px; }
.row .txt { padding: 12px 14px 12px 0; min-width: 0; }
.row .txt b { display: block; font: 600 18px/1.25 var(--serif); font-variation-settings: "SOFT" 100; color: var(--burgundy); }
.row .txt span { font-size: 16px; margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.stats { list-style: none; padding: 0; margin: 10px 0 0; }
.stats li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 2px dotted var(--ink); font-variant-numeric: tabular-nums; }

/* ---- bottom tabs ---- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 12px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--cream); border-top: 3px solid var(--ink); }
.tabs button { flex: 1; max-width: 250px; padding: 12px 8px; cursor: pointer; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px;
  font: 800 16px/1 var(--sans); background: var(--paper); border: 3px solid var(--ink); border-radius: 99px; }
.tabs button[aria-current=page] { background: var(--butter); box-shadow: 4px 4px 0 var(--ink); transform: translate(-2px, -2px); }
.tabs svg { width: 20px; height: 20px; flex: none; }
</style>
</head>
<body>
<main id="app"><p class="small" style="padding:24px 18px">Opening your journal...</p></main>
<nav class="tabs" id="tabs" hidden aria-label="Journal">
  <button data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19l-5 1z"/><path d="M13.5 6.5l4 4"/></svg>Today</button>
  <button data-view="entries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 9h6M9 13h6"/></svg>My entries</button>
</nav>
<script src="config.js"></script>
<script>
// ---------- small helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const nice = (s, opts = { weekday: 'long', month: 'long', day: 'numeric' }) => parse(s).toLocaleDateString('en-US', opts);
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo') || !CONFIG.SUPABASE_URL;
// ?day=2027-01-02 pretends it is that day, so the January prompts can be previewed before January.
const PREVIEW_DAY = /^\d{4}-\d\d-\d\d$/.test(params.get('day') || '') ? params.get('day') : null;
const today = () => PREVIEW_DAY || iso(new Date());
const QUESTION = "What's the best thing that could happen?";

// A streak is the run of days in a row with any writing, ending today or yesterday.
function streakOf(days, from) {
  let d = days.has(from) ? from : addDays(from, -1), n = 0;
  while (days.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
console.assert(streakOf(new Set(['2027-01-01', '2027-01-02']), '2027-01-03') === 2, 'streak counts through yesterday');
console.assert(streakOf(new Set(['2027-01-01']), '2027-01-03') === 0, 'streak breaks after a missed day');
console.assert(streakOf(new Set(['2026-12-31', '2027-01-01']), '2027-01-01') === 2, 'streak crosses a year');

// ---------- where the data lives ----------
// Two stores with the same five methods. Demo keeps everything on this device.
const demoStore = {
  async init() { return JSON.parse(localStorage.bcjDemoUser || 'null'); },
  async signIn(email) { localStorage.bcjDemoUser = JSON.stringify({ email }); return 'in'; },
  async signOut() { localStorage.removeItem('bcjDemoUser'); },
  async load() {
    const list = await fetch('prompts.json').then(r => r.json());
    return {
      prompts: Object.fromEntries(list.map(p => [p.date, p])),
      entries: params.get('locked') === '2' ? {} : JSON.parse(localStorage.bcjDemoEntries || '{}'),
      access: !params.has('locked'), stats: null,
    };
  },
  async save(date, kind, body) {
    const all = JSON.parse(localStorage.bcjDemoEntries || '{}');
    if (body.trim()) all[date + '|' + kind] = body; else delete all[date + '|' + kind];
    localStorage.bcjDemoEntries = JSON.stringify(all);
  },
};
let sb;
const cloudStore = {
  async init() {
    await new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = ok; s.onerror = no; document.head.append(s);
    });
    sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    const { data } = await sb.auth.getSession();
    return data.session?.user || null;
  },
  async signIn(email, meta) {
    const { error } = await sb.auth.signInWithOtp({
      email, options: { emailRedirectTo: location.origin + location.pathname, data: meta },
    });
    if (error) throw error;
    return 'sent';
  },
  async signOut() { await sb.auth.signOut(); },
  async load() {
    // ponytail: one request returns up to 1,000 entries (about 16 months of daily writing). Page through when someone gets there.
    const [p, e, a, st] = await Promise.all([
      sb.from('prompts').select('day,title,prompt'),
      sb.from('entries').select('entry_date,kind,body').order('entry_date'),
      sb.rpc('has_journal_access'),
      sb.rpc('journal_stats'),
    ]);
    if (p.error || e.error) throw p.error || e.error;
    return {
      prompts: Object.fromEntries(p.data.map(r => [r.day, r])),
      entries: Object.fromEntries(e.data.map(r => [r.entry_date + '|' + r.kind, r.body])),
      access: a.data === true, stats: st.data || null,
    };
  },
  async save(date, kind, body) {
    const q = body.trim()
      ? sb.from('entries').upsert({ user_id: S.user.id, entry_date: date, kind, body, updated_at: new Date().toISOString() })
      : sb.from('entries').delete().match({ user_id: S.user.id, entry_date: date, kind });
    const { error } = await q;
    if (error) throw error;
  },
};
const store = DEMO ? demoStore : cloudStore;

// ---------- state ----------
const S = { user: null, prompts: {}, entries: {}, access: true, stats: null, view: 'today', date: null };
const app = $('#app'), tabs = $('#tabs');

// ---------- saving ----------
// Every keystroke lands in S.entries and in a local backup first, then goes to the cloud after a short pause.
// If the cloud save fails, the backup is replayed the next time the journal opens, so words are not lost.
const pending = {};
const backup = {
  all() { try { return JSON.parse(localStorage.bcjUnsaved || '{}'); } catch { return {}; } },
  set(key, body) { const a = this.all(); a[key] = body; localStorage.bcjUnsaved = JSON.stringify(a); },
  clear(key, body) { const a = this.all(); if (a[key] === body) { delete a[key]; localStorage.bcjUnsaved = JSON.stringify(a); } },
};
function queueSave(date, kind, body, el) {
  const key = date + '|' + kind;
  if (body.trim()) S.entries[key] = body; else delete S.entries[key];
  backup.set(S.user.email + '|' + key, body);
  el.textContent = 'Saving...'; el.className = 'status';
  clearTimeout(pending[key]?.timer);
  pending[key] = { date, kind, el, timer: setTimeout(() => flush(key), 700) };
}
async function flush(key) {
  const job = pending[key]; if (!job) return;
  clearTimeout(job.timer); delete pending[key];
  const body = S.entries[key] || '';
  try {
    await store.save(job.date, job.kind, body);
    backup.clear(S.user.email + '|' + key, body);
    if (!pending[key]) { job.el.textContent = 'Saved'; job.el.className = 'status ok'; job.el.removeAttribute('role'); renderChip(); }
  } catch (err) {
    console.error(err);
    job.el.textContent = "Not saved yet. Your words are safe on this phone. I'll keep trying."; job.el.className = 'status bad'; job.el.setAttribute('role', 'alert');
    pending[key] = { ...job, timer: setTimeout(() => flush(key), 5000) };
  }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) Object.keys(pending).forEach(flush); });
async function replayBackup() {
  for (const [k, body] of Object.entries(backup.all())) {
    const [email, date, kind] = k.split('|');
    if (email !== S.user.email) continue;
    try { await store.save(date, kind, body); backup.clear(k, body); if (body.trim()) S.entries[date + '|' + kind] = body; } catch { /* next time */ }
  }
}

// ---------- screens ----------
const daysWritten = () => new Set(Object.keys(S.entries).map(k => k.split('|')[0]));
const streak = () => streakOf(daysWritten(), today());
// little drawings, all in one ink weight
const SPARK = (x, y, s, c, r = 0) => `<svg class="deco" style="left:${x};top:${y};transform:rotate(${r}deg)" width="${s}" height="${s}" viewBox="-6 -6 112 112" aria-hidden="true"><path d="M50 0C54 34 66 46 100 50C66 54 54 66 50 100C46 66 34 54 0 50C34 46 46 34 50 0Z" fill="${c}" stroke="#2A0F1C" stroke-width="7" stroke-linejoin="round"/></svg>`;
const CLOUD = (x, y, w) => `<svg class="deco" style="left:${x};top:${y}" width="${w}" viewBox="0 0 280 160" aria-hidden="true"><path d="M60 120C20 120 14 76 52 70C50 36 96 22 116 48C134 14 196 22 196 62C236 56 250 112 210 120Z" fill="#2A0F1C" transform="translate(9 9)"/><path d="M60 120C20 120 14 76 52 70C50 36 96 22 116 48C134 14 196 22 196 62C236 56 250 112 210 120Z" fill="#FFF9F0" stroke="#2A0F1C" stroke-width="7" stroke-linejoin="round"/><circle cx="112" cy="80" r="5.5" fill="#2A0F1C"/><circle cx="156" cy="80" r="5.5" fill="#2A0F1C"/><path d="M120 94Q134 108 148 94" fill="none" stroke="#2A0F1C" stroke-width="6" stroke-linecap="round"/><circle cx="98" cy="94" r="8" fill="#F2689F" opacity=".8"/><circle cx="170" cy="94" r="8" fill="#F2689F" opacity=".8"/></svg>`;
const RAYS = `<svg class="rays" viewBox="-109 -109 218 218" aria-hidden="true">${Array.from({ length: 22 }, (_, i) => { const a = Math.PI * 2 * i / 22, r2 = i % 2 ? 106 : 96; return `<line x1="${(80 * Math.cos(a)).toFixed(1)}" y1="${(80 * Math.sin(a)).toFixed(1)}" x2="${(r2 * Math.cos(a)).toFixed(1)}" y2="${(r2 * Math.sin(a)).toFixed(1)}"/>`; }).join('')}<style>.rays line{stroke:#FFD45E;stroke-width:6;stroke-linecap:round}</style></svg>`;
const SMILE = '<svg viewBox="0 0 60 40" aria-hidden="true"><circle cx="16" cy="12" r="4.5" fill="#2A0F1C"/><circle cx="44" cy="12" r="4.5" fill="#2A0F1C"/><path d="M14 24Q30 40 46 24" fill="none" stroke="#2A0F1C" stroke-width="5" stroke-linecap="round"/></svg>';
const STICKER = '<span class="sticker"><img src="assets/stamp-burgundy.png" alt=""></span>';

function signInScreen(msg = '') {
  tabs.hidden = true;
  app.innerHTML = `

      ${SPARK('80%', '30px', 30, '#FFD45E', 10)}${SPARK('11%', '150px', 20, '#FFF9F0')}${SPARK('90%', '112px', 16, '#FFF9F0')}
      ${RAYS}<div class="bigsun"><span class="sticker"><img src="assets/stamp-burgundy.png" alt="Best Case Scenario Club. What's the best thing that could happen?"></span></div>
      <h1 class="display">The Best Case <em>Journal</em></h1>
    </header>
    <div class="pad">
      <form class="card stack" id="f" novalidate>
        <h2>One question a&nbsp;day. A few honest sentences. That's it.</h2>
        ${DEMO ? '<p class="note">Demo. Type any email. Nothing is sent.</p>' : ''}
        <label class="check"><input type="checkbox" id="u13"><span>I'm under&nbsp;13, or this is for a bowler under&nbsp;13</span></label>
        <p class="small" id="u13note" hidden>Then I need a parent's email, not yours. The sign-in link goes to the parent. A parent's email opens this journal, so a parent can read it too.</p>
        <div><label for="email" id="elabel">Your email</label>
          <input type="email" id="email" autocomplete="email" inputmode="email" required></div>
        <p class="err" id="err" role="alert">${esc(msg)}</p>
        <button class="btn">Email me my sign-in link</button>
        <p class="small">No password. Tap the link in your email and you're in.</p>
      </form>
      <aside class="promise"><p>What you write here is private, and I can't read it.</p><span class="hand">Diandra</span></aside>
    </div>`;
  const u13 = $('#u13');
  u13.onchange = () => { $('#elabel').textContent = u13.checked ? "A parent's email" : 'Your email'; $('#u13note').hidden = !u13.checked; $('#email').value = ''; $('#email').focus(); };
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const email = $('#email').value.trim().toLowerCase(), btn = $('.btn', ev.target), kid = u13.checked;
    if (!/^\S+@\S+\.\S+$/.test(email)) { $('#err').textContent = u13.checked ? "Please type a parent's email." : 'Please type your email.'; $('#email').focus(); return; }
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      const r = await store.signIn(email, u13.checked ? { under_13: true, parent_email: email } : {});
      if (r === 'in') return start();
      app.innerHTML = `<header class="band hero" style="padding-bottom:64px">${CLOUD('70%', '26px', 100)}${SPARK('12%', '40px', 30, '#FFD45E', 10)}<h1 class="display" style="margin-top:44px">Check your <em>inbox.</em></h1></header>
        <div class="pad"><section class="card stack"><h2>Your sign-in link is on its way.</h2><p>It's headed to <b>${esc(email)}</b>. ${kid ? 'Open that email on the phone or tablet your bowler will write on, tap the link, and the journal opens there.' : "Open that email on this phone, tap the link, and you're in."}</p>
        <p class="small">Nothing after a few minutes? Look in spam, then try again.</p><button class="link" id="again">Use a different email</button></section></div>`;
      $('#again').onclick = () => signInScreen();
    } catch (err) {
      console.error(err);
      btn.disabled = false; btn.textContent = 'Email me my sign-in link';
      $('#err').textContent = /rate|seconds/i.test(err.message || '') ? 'Too many tries in a row. Give it a minute, then try again.' : "That didn't send. Check the email and try again.";
    }
  };
}

function dayScreen() {
  const d = S.date, isToday = d === today(), p = S.prompts[d], off = S.access ? '' : 'disabled', n = dayNumber(d);
  const y = addDays(d, -1), yText = S.entries[y + '|prompt'] || S.entries[y + '|free'];
  const before = d < CONFIG.CHALLENGE_START && !p;
  const title = p?.title ? esc(p.title) : before ? 'Starts <em>January 1</em>' : 'The page is <em>yours</em>';
  app.innerHTML = band(title, esc(nice(d)) + (n ? `<br>Day ${n} of 28` : '')) + `<div class="pad">
    ${notes()}${lockCard()}
    ${isToday ? '' : '<button class="link" id="back">Back to today</button>'}
    ${p ? `<section class="card">
        <span class="hand"><span style="letter-spacing:-.14em">T</span>${isToday ? "oday's question" : 'he question'}</span>
        <h2 id="q">${esc(p.prompt)}</h2>
        <textarea id="t-prompt" aria-labelledby="q" placeholder="Start anywhere." ${off}>${esc(S.entries[d + '|prompt'] || '')}</textarea>
        <div class="status" id="s-prompt"></div>
      </section>`
    : before ? `<section class="card mint"><h2>Your first question shows up here on January 1.</h2><p>Until then, the page below is all yours.</p></section>` : ''}
    <section class="card">
      <div class="cap lilac"><h2 class="hand" id="fl">Anything else?</h2></div>
      <textarea id="t-free" aria-labelledby="fl" placeholder="Write whatever is on your mind. Nobody is grading this." ${off}>${esc(S.entries[d + '|free'] || '')}</textarea>
      <div class="status" id="s-free"></div>
    </section>
    ${yText ? `<div class="stack" style="gap:8px"><h2 class="hand" style="align-self:flex-start">Yesterday</h2>${rowHtml(y)}</div>` : ''}</div>`;
  for (const kind of ['prompt', 'free']) {
    const t = $('#t-' + kind); if (!t) continue;
    const grow = () => { if (!CSS.supports('field-sizing', 'content')) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; } };
    grow();
    t.oninput = () => { grow(); queueSave(d, kind, t.value, $('#s-' + kind)); };
    t.onblur = () => flush(d + '|' + kind);
  }
  wire();
}

const TAB_COLORS = ['var(--mint)', 'var(--butter)', 'var(--lilac)', 'var(--pink-2)'];
const rowHtml = d => `<button class="row" data-date="${d}">
  <span class="tab" style="background:${TAB_COLORS[parse(d).getDate() % 4]}">${esc(nice(d, { month: 'short' }))}<b>${parse(d).getDate()}</b></span>
  <span class="txt"><b>${esc(S.prompts[d]?.prompt || nice(d))}</b><span>${esc(S.entries[d + '|prompt'] || S.entries[d + '|free'])}</span></span></button>`;

function entriesScreen() {
  const written = daysWritten(), dates = [...written].sort().reverse(), st = S.stats, t = today();
  // The calendar: every day this month that has a question. A sun comes up on each day you wrote.
  const month = Object.keys(S.prompts).filter(d => d.slice(0, 7) === t.slice(0, 7)).sort();
  app.innerHTML = band('My <em>entries</em>', dates.length ? `${dates.length} ${dates.length === 1 ? 'day' : 'days'} written so far` : 'Nothing here yet') + `<div class="pad">
    ${notes()}${lockCard()}
    ${month.length ? `<section class="card"><div class="cap mint"><h2 class="hand">My ${esc(nice(t, { month: 'long' }))}</h2></div>
      <div class="days">${month.map(d => `<button class="day ${written.has(d) ? 'on' : d === t ? 'now' : d > t ? 'later' : ''}" ${d > t ? 'disabled' : `data-date="${d}"`} aria-label="${esc(nice(d))}${written.has(d) ? ', written' : d === t ? ', today' : d > t ? ', not open yet' : ''}">${parse(d).getDate()}</button>`).join('')}</div>
      <p class="key"><span><i style="background:var(--sun)"></i>You wrote</span><span><i style="background:var(--pink)"></i>Today</span><span><i style="background:var(--paper)"></i>Still open</span><span><i style="background:var(--paper);border-style:dashed;border-color:#BFAE9C"></i>Coming up</span></p></section>` : ''}
    ${dates.length ? '' : '<section class="card lilac"><h2>Your first entry shows up here.</h2><p>Go answer today\'s question. A few honest sentences is plenty.</p></section>'}
    <div class="stack"><button class="btn" id="pdf" ${dates.length ? '' : 'disabled'}>Download my journal (PDF)</button>
    <p class="err" id="pdferr" role="alert"></p></div>
    <div class="stack">${dates.map(d => rowHtml(d)).join('')}</div>
    ${st ? `<section class="card"><div class="cap butter"><h2 class="hand">Club numbers</h2></div>
      <p class="small">Only you see this, Diandra. Counts only. Nobody's words.</p>
      <ul class="stats">${Object.entries(st).map(([k, v]) => `<li><span>${esc(k.replace(/_/g, ' '))}</span><b>${esc(v ?? 0)}</b></li>`).join('')}</ul></section>` : ''}

const signedIn = () => `<p class="small">Signed in as ${esc(S.user.email)}. <button class="link" id="out">Sign out</button></p>`;
// After a screen change, put keyboard and screen-reader focus on the new heading and name the page.
function landed(name) { document.title = name + ' · The Best Case Journal'; const h = $('h1'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
function wire() {
  const out = $('#out'); if (out) out.onclick = async () => { await Promise.all(Object.keys(pending).map(flush)); await store.signOut(); S.user = null; signInScreen(); };
  app.querySelectorAll('[data-date]').forEach(b => b.onclick = () => go('today', b.dataset.date));
  const back = $('#back'); if (back) back.onclick = () => go('today', today());
}
function go(view, date) {
  Object.keys(pending).forEach(flush);
  S.view = view; S.date = date || today();
  // Not a member and reading is switched off too: only the "join the Club" card shows.
  if (!S.access && !Object.keys(S.entries).length) { tabs.hidden = true; app.innerHTML = band('See you in the <em>Club</em>', esc(nice(today()))) + `<div class="pad">${notes()}${lockCard()}${signedIn()}</div>`; wire(); landed('Members only'); return; }
  tabs.hidden = false;
  tabs.querySelectorAll('button').forEach(b => b.dataset.view === view && S.date === today() ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  view === 'entries' ? entriesScreen() : dayScreen();
  scrollTo(0, 0);
  landed(view === 'entries' ? 'My entries' : nice(S.date));
}
tabs.onclick = ev => { const v = ev.target.closest('button')?.dataset.view; if (v) go(v, today()); };

// ---------- the PDF ----------
// Built on the phone itself, so the words never pass through anyone else's computer.
// Page size is 5.5 x 8.5 inches, the same trim as the printed journal.
const loadScript = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.append(s); });
async function exportPdf() {
  if (!window.PDFLib) await loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');
  if (!window.fontkit) await loadScript('https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js');
  const { PDFDocument, rgb } = PDFLib;
  const hex = h => rgb(...[1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255));
  const C = { cream: hex('#F3ECE1'), paper: hex('#FFF9F0'), plum: hex('#4A2140'), burgundy: hex('#6B1E2E'), pink: hex('#F2689F'), pink2: hex('#F47BAB'), sun: hex('#F7A531'), butter: hex('#FFD45E'), mint: hex('#93DEC8'), ink: hex('#2A0F1C') };
  const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.arrayBuffer(); });
  const doc = await PDFDocument.create(); doc.registerFontkit(fontkit);
  const plain = { features: { rvrn: false, liga: false } }; // alternate letter shapes come out with wrong spacing in a PDF
  const [reg, bold, black, hand, stamp] = await Promise.all([
    get('assets/Fraunces-400.ttf').then(b => doc.embedFont(b, plain)), get('assets/Fraunces-600.ttf').then(b => doc.embedFont(b, plain)),
    get('assets/Fraunces-900i.ttf').then(b => doc.embedFont(b, plain)),
    get('assets/DiandraHand-Marker.otf').then(b => doc.embedFont(b)), get('assets/stamp-burgundy.png').then(b => doc.embedPng(b)),
  ]);
  doc.setTitle('My Best Case Journal');
  const W = 396, H = 612, M = 46, TW = W - 2 * M;
  // Fonts cannot draw every character (emoji, for one). Drop the ones they cannot.
  const clean = (text, font) => {
    const has = new Set(font.getCharacterSet());
    return [...text.replace(/\t/g, ' ').replace(/\r/g, '')].filter(ch => ch === '\n' || has.has(ch.codePointAt(0))).join('');
  };
  const wrap = (text, font, size) => {
    const out = [];
    for (const para of clean(text, font).split('\n')) {
      let line = '';
      for (let word of para.split(/ +/)) {
        while (font.widthOfTextAtSize(word, size) > TW) { // one very long word: break it
          let n = word.length; while (n > 1 && font.widthOfTextAtSize(word.slice(0, n), size) > TW) n--;
          if (line) { out.push(line); line = ''; }
          out.push(word.slice(0, n)); word = word.slice(n);
        }
        const t = line ? line + ' ' + word : word;
        if (font.widthOfTextAtSize(t, size) <= TW) line = t; else { out.push(line); line = word; }
      }
      out.push(line);
    }
    return out;
  };
  const center = (page, text, font, size, y, color) => page.drawText(text, { x: (W - font.widthOfTextAtSize(text, size)) / 2, y, size, font, color });
  const SPARKP = 'M50 0C54 34 66 46 100 50C66 54 54 66 50 100C46 66 34 54 0 50C34 46 46 34 50 0Z';
  const spark = (page, x, y, size, color) => page.drawSvgPath(SPARKP, { x: x - size / 2, y: y + size / 2, scale: size / 100, color, borderColor: C.ink, borderWidth: 1.6 });
  const disc = (page, x, y, r, color, bw = 2.5) => { // a circle with the Club's ink outline and block shadow
    page.drawCircle({ x: x + 3.5, y: y - 3.5, size: r, color: C.ink });
    page.drawCircle({ x, y, size: r, color, borderColor: C.ink, borderWidth: bw });
  };

  const dates = [...daysWritten()].sort();
  // ---- cover: the Club's sunburst, sun and stamp sticker ----
  const cover = doc.addPage([W, H]), cx = W / 2, cy = 384;
  cover.drawRectangle({ x: 0, y: 0, width: W, height: H, color: C.pink });
  for (let i = 0; i < 20; i++) { // sunburst wedges
    const a1 = (i * 18) * Math.PI / 180, a2 = (i * 18 + 9) * Math.PI / 180, R = 900;
    cover.drawSvgPath(`M0 0L${(R * Math.cos(a1)).toFixed(1)} ${(R * Math.sin(a1)).toFixed(1)}L${(R * Math.cos(a2)).toFixed(1)} ${(R * Math.sin(a2)).toFixed(1)}Z`, { x: cx, y: cy, color: C.pink2 });
  }
  for (let i = 0; i < 26; i++) { // rays
    const a = Math.PI * 2 * i / 26, r2 = i % 2 ? 168 : 156;
    cover.drawLine({ start: { x: cx + 142 * Math.cos(a), y: cy + 142 * Math.sin(a) }, end: { x: cx + r2 * Math.cos(a), y: cy + r2 * Math.sin(a) }, thickness: 4.5, color: C.butter, lineCap: PDFLib.LineCapStyle.Round });
  }
  disc(cover, cx, cy, 128, C.sun, 3);
  for (const [d1, d2] of [[62, 74], [90, 106]]) { // pink stripes across the lower sun, cut to the circle
    const r = 126.5, w1 = Math.sqrt(r * r - d1 * d1), w2 = Math.sqrt(r * r - d2 * d2);
    cover.drawSvgPath(`M${-w1} ${d1}L${w1} ${d1}A${r} ${r} 0 0 1 ${w2} ${d2}L${-w2} ${d2}A${r} ${r} 0 0 1 ${-w1} ${d1}Z`, { x: cx, y: cy, color: C.pink });
  }
  disc(cover, cx, cy, 100, C.paper);
  const sw = 182, sh = sw * stamp.height / stamp.width, th = 8 * Math.PI / 180;
  cover.drawImage(stamp, { x: cx - (sw / 2 * Math.cos(th) - sh / 2 * Math.sin(th)), y: cy - (sw / 2 * Math.sin(th) + sh / 2 * Math.cos(th)), width: sw, height: sh, rotate: PDFLib.degrees(8) });
  [[62, 548, 26, C.butter], [330, 520, 16, C.paper], [48, 262, 14, C.paper], [344, 236, 24, C.butter]].forEach(a => spark(cover, ...a));
  const title = (text, y, color) => { // chunky italic with an ink outline and block shadow
    const size = 40, x = (W - black.widthOfTextAtSize(text, size)) / 2;
    cover.drawText(text, { x: x + 3, y: y - 3.5, size, font: black, color: C.ink });
    for (let i = 0; i < 12; i++) cover.drawText(text, { x: x + 1.8 * Math.cos(i * Math.PI / 6), y: y + 1.8 * Math.sin(i * Math.PI / 6), size, font: black, color: C.ink });
    cover.drawText(text, { x, y, size, font: black, color });
  };
  title('My Best Case', 150, C.paper); title('Journal', 106, C.butter);
  const span = { month: 'long', day: 'numeric', year: 'numeric' };
  const range = dates.length > 1 ? `${nice(dates[0], span)} to ${nice(dates.at(-1), span)}` : nice(dates[0], span);
  const pw = bold.widthOfTextAtSize(range, 12) + 32, pill = `M12 0H${pw - 12}A12 12 0 0 1 ${pw - 12} 24H12A12 12 0 0 1 12 0Z`;
  cover.drawSvgPath(pill, { x: (W - pw) / 2 + 3, y: 67 - 3, color: C.ink });
  cover.drawSvgPath(pill, { x: (W - pw) / 2, y: 67, color: C.mint, borderColor: C.ink, borderWidth: 2 });
  center(cover, range, bold, 12, 50.8, C.ink);

  // one day per page (longer days run on)
  let page, y, n = 0;
  const newPage = () => {
    page = doc.addPage([W, H]); n++;
    page.drawRectangle({ x: 0, y: 0, width: W, height: H, color: C.cream });
    page.drawCircle({ x: W / 2, y: 32, size: 12, color: C.butter, borderColor: C.ink, borderWidth: 1.4 });
    center(page, String(n), bold, 12, 27.8, C.ink);
    y = H - 58;
  };
  const write = (lines, font, size, color, lead) => { for (const l of lines) { if (y < 62) newPage(); page.drawText(l, { x: M, y, size, font, color }); y -= lead; } };
  for (const d of dates) {
    newPage();
    page.drawCircle({ x: M + 8, y: y + 5.5, size: 8, color: C.sun, borderColor: C.ink, borderWidth: 1.4 });
    page.drawText(nice(d, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }), { x: M + 24, y, size: 16, font: bold, color: C.burgundy }); y -= 12;
    page.drawLine({ start: { x: M, y }, end: { x: W - M, y }, thickness: 1.4, color: C.ink, dashArray: [1, 4], lineCap: PDFLib.LineCapStyle.Round }); y -= 26;
    const p = S.prompts[d], a = S.entries[d + '|prompt'], f = S.entries[d + '|free'];
    if (a) {
      if (p) { write(wrap(p.prompt, bold, 13), bold, 13, C.plum, 18); y -= 6; }
      write(wrap(a, reg, 12), reg, 12, C.ink, 18); y -= 16;
    }
    if (f) {
      if (y < 110) newPage();
      write(['Anything else?'], hand, 17, hex('#C2255F'), 24);
      write(wrap(f, reg, 12), reg, 12, C.ink, 18);
    }
  }
  const url = URL.createObjectURL(new Blob([await doc.save()], { type: 'application/pdf' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'My Best Case Journal.pdf' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ---------- go ----------
async function start() {
  try {
    const linkError = new URLSearchParams(location.hash.slice(1)).get('error_description');
    S.user = await store.init();
    if (!S.user) return signInScreen(linkError ? 'That sign-in link is old or already used. Ask for a fresh one below.' : '');
    Object.assign(S, await store.load());
    await replayBackup();
    go(params.get('v') === 'entries' ? 'entries' : 'today', today());
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="pad"><div class="card stack"><h2>The journal didn't open.</h2><p>Check your connection, then try again.</p><button class="btn" onclick="location.reload()">Try again</button></div></div>`;
  }
}
start();
</script>
